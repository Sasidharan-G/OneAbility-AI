# One-click deploy blueprint for Render (https://render.com).
# Render reads this file automatically when you create a "Blueprint" from this repo.
services:
  - type: web
    name: oneability-ai
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SERVE_FRONTEND
        value: "1"
      - key: GEMINI_API_KEY
        sync: false          # optional: paste your key in the Render dashboard after deploy
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: HIGH_AMOUNT_THRESHOLD
        value: "5000"
      - key: TXN_LIMIT
        value: "100000"
      - key: DUPLICATE_WINDOW_SECONDS
        value: "120"
