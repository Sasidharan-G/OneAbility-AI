<!doctype html>
<html lang="en" data-theme="light" data-contrast="normal" data-simple="off" data-dwell="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OneAbility AI</title>
  <meta name="description" content="OneAbility AI: an accessibility-first simulated digital payment assistant. Simulation only, no real money.">
  <meta name="theme-color" content="#0b5fff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#main" class="skip-link" id="skip-link">Skip to main content</a>

  <div class="top-stack">
    <header class="app-bar" role="banner">
      <a href="#/home" class="brand" id="brand">
        <img src="icons/icon.svg" alt="" width="36" height="36">
        <span class="brand-text">OneAbility <strong>AI</strong></span>
      </a>
      <div class="app-bar-actions">
        <button type="button" class="chip-btn" id="lang-btn">த</button>
        <a href="#/help" class="icon-btn" id="help-link"></a>
        <button type="button" class="stop-btn" id="stop-btn"></button>
      </div>
    </header>
    <div id="net-status" class="net-status" role="status" hidden></div>
    <div id="captions" class="captions" role="region" hidden aria-label="Captions" data-kind="info">
      <span class="caption-badge">Dex</span>
      <p class="caption-text"></p>
      <button type="button" class="caption-close" aria-label="Close">×</button>
    </div>
  </div>

  <div class="shell">
    <nav id="nav" class="nav" aria-label="Main"><ul></ul></nav>
    <main id="main" tabindex="-1"><div id="app"></div></main>
  </div>

  <div id="live-polite" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="live-assertive" class="visually-hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <div id="toasts" class="toasts"></div>
  <div id="flash" class="flash" aria-hidden="true" data-kind="success"></div>

  <noscript><p class="noscript">OneAbility AI needs JavaScript to run.</p></noscript>

  <script src="vendor/jsQR.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
